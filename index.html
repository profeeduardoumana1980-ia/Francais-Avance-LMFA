<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Français Avancé – Pratiques DELF/DALF</title>
  <meta name="description" content="Site pédagogique de FLE : entraînement DELF/DALF (CO et CE, A1 à C1), matériel, projets, messagerie des groupes et évaluations.">

  <style>
/* ==========================================================
   Français Avancé – Pratiques DELF/DALF
   Feuille de style principale
   Palette : bleu institutionnel, blanc, rouge discret
   ========================================================== */

:root {
  --bleu: #1d3a6e;
  --bleu-fonce: #142a52;
  --bleu-clair: #e8eef8;
  --rouge: #b40d27;
  --rouge-clair: #fbe9ec;
  --vert: #1d6b3a;
  --vert-clair: #e6f4ea;
  --orange: #8a4b00;
  --orange-clair: #fff3e0;
  --texte: #1c2230;
  --texte-doux: #4a5468;
  --bord: #d5dbe6;
  --fond: #f6f7fa;
  --blanc: #ffffff;
  --rayon: 10px;
  --ombre: 0 1px 3px rgba(20, 30, 60, .08), 0 4px 14px rgba(20, 30, 60, .06);
  --police: "Nunito", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  --police-titres: "Poppins", "Nunito", "Segoe UI", system-ui, sans-serif;
  --accent: #c2410c;
  --accent-fonce: #9a330a;
  --jaune: #ffd166;
  --niv-A1: #17803d; --niv-A1-clair: #e3f4e8;
  --niv-A2: #0b7a85; --niv-A2-clair: #e0f3f4;
  --niv-B1: #1d4ed8; --niv-B1-clair: #e4ebfc;
  --niv-B2: #6d28d9; --niv-B2-clair: #efe7fc;
  --niv-C1: #9a6700; --niv-C1-clair: #fbf1dc;
  --police-texte: Georgia, "Times New Roman", serif;
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  font-family: var(--police);
  font-size: 1.0625rem;
  line-height: 1.6;
  color: var(--texte);
  background: var(--fond);
}

img { max-width: 100%; height: auto; }

a { color: var(--bleu); }
a:hover { color: var(--rouge); }

:focus-visible {
  outline: 3px solid #f2b705;
  outline-offset: 2px;
}

.skip-link {
  position: absolute;
  left: -9999px;
  top: 0;
  background: var(--bleu);
  color: #fff;
  padding: .6rem 1rem;
  z-index: 100;
}
.skip-link:focus { left: 1rem; top: 1rem; }

/* ---------- En-tête ---------- */

.site-header {
  background: var(--bleu);
  color: #fff;
  border-bottom: 4px solid var(--rouge);
}

.header-inner {
  max-width: 1160px;
  margin: 0 auto;
  padding: .7rem 1rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
}

.brand {
  display: flex;
  align-items: center;
  gap: .75rem;
  color: #fff;
  text-decoration: none;
}
.brand:hover { color: #fff; }

.brand-mark {
  display: inline-grid;
  place-items: center;
  width: 2.6rem;
  height: 2.6rem;
  border-radius: 8px;
  background: #fff;
  color: var(--bleu);
  font-weight: 800;
  font-size: .85rem;
  letter-spacing: .03em;
  box-shadow: inset -6px 0 0 var(--rouge);
}

.brand-text { display: flex; flex-direction: column; line-height: 1.2; }
.brand-title { font-weight: 700; font-size: 1.1rem; }
.brand-sub { font-size: .85rem; opacity: .85; }

.header-tools { display: flex; gap: .5rem; align-items: center; }

.toggle-es {
  font: inherit;
  font-size: .9rem;
  border: 1px solid rgba(255,255,255,.55);
  background: transparent;
  color: #fff;
  border-radius: 999px;
  padding: .35rem .8rem;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: .4rem;
}
.toggle-es span[aria-hidden] {
  font-weight: 800;
  font-size: .75rem;
  background: rgba(255,255,255,.2);
  border-radius: 4px;
  padding: 0 .3rem;
}
.toggle-es[aria-pressed="true"] { background: #fff; color: var(--bleu); }
.toggle-es[aria-pressed="true"] span[aria-hidden] { background: var(--bleu); color: #fff; }

/* ---------- Contenu ---------- */

main {
  max-width: 1160px;
  margin: 0 auto;
  padding: 1.5rem 1rem 3rem;
  outline: none;
}

h1, h2, h3 { color: var(--bleu-fonce); line-height: 1.25; font-family: var(--police-titres); letter-spacing: -.01em; }
h1 { font-size: clamp(1.5rem, 3.2vw, 2.1rem); margin: .2rem 0 .6rem; }
h2 { font-size: 1.35rem; margin-top: 2rem; }
h3 { font-size: 1.1rem; }

.lead { font-size: 1.12rem; color: var(--texte-doux); max-width: 70ch; }

.es { display: none; }
body.show-es .es { display: block; }
body.show-es span.es { display: inline; }
.es {
  color: #5a3d00;
  background: #fff8e6;
  border-left: 3px solid #e0a800;
  padding: .25rem .6rem;
  border-radius: 0 6px 6px 0;
  font-size: .95em;
  margin: .3rem 0 .6rem;
}
.es::before { content: "ES · "; font-weight: 700; font-size: .8em; }

.loading, .vide {
  color: var(--texte-doux);
  font-style: italic;
}

.breadcrumb { font-size: .9rem; margin-bottom: .5rem; }
.breadcrumb a { text-decoration: none; }

/* ---------- Bannière d'en-tête (image + message défilant) ---------- */

.site-header { padding: 0; border-bottom: 0; }
.entete-banniere {
  position: relative;
  max-width: 1160px;
  margin: 0 auto;
  height: clamp(300px, 50vw, 600px);
  overflow: hidden;
  background: var(--bleu-fonce);
  transition: height .35s ease;
}
body:not(.page-accueil) .entete-banniere { height: clamp(150px, 20vw, 230px); }
.banniere-lien { display: block; height: 100%; }
.banniere-img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.entete-banniere::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(20,42,82,.35) 0%, rgba(20,42,82,0) 25%, rgba(20,42,82,0) 55%, rgba(20,42,82,.55) 100%);
  pointer-events: none;
}
.banniere-bandeau {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 6%;
  z-index: 1;
  overflow: hidden;
  background: rgba(20, 42, 82, .82);
  border-top: 3px solid var(--rouge);
  border-bottom: 3px solid var(--rouge);
  -webkit-backdrop-filter: blur(3px);
          backdrop-filter: blur(3px);
}
body:not(.page-accueil) .banniere-bandeau { bottom: 8%; }
.banniere-piste {
  display: flex;
  width: max-content;
  animation: defilement 40s linear infinite;
}
.banniere-serie { display: flex; align-items: center; flex: none; }
.ban-msg {
  color: #fff;
  font-weight: 800;
  font-size: clamp(1.05rem, 2.6vw, 1.75rem);
  letter-spacing: .01em;
  white-space: nowrap;
  padding: .6rem 0;
  text-shadow: 0 2px 6px rgba(0,0,0,.35);
}
body:not(.page-accueil) .ban-msg { font-size: clamp(.95rem, 1.8vw, 1.2rem); padding: .4rem 0; }
.ban-sep { color: var(--rouge); margin: 0 1.6rem; font-size: .9rem; }
.entete-banniere:hover .banniere-piste,
.entete-banniere.en-pause .banniere-piste { animation-play-state: paused; }

/* Boutons posés sur l'image : pause et espagnol */
.entete-outils {
  position: absolute;
  top: .7rem;
  right: .7rem;
  z-index: 2;
  display: flex;
  gap: .5rem;
  align-items: center;
}
.entete-outils .toggle-es {
  background: rgba(15,26,46,.7);
  border-color: rgba(255,255,255,.8);
  -webkit-backdrop-filter: blur(3px);
          backdrop-filter: blur(3px);
  min-height: 40px;
}
.entete-outils .toggle-es[aria-pressed="true"] { background: #fff; color: var(--bleu); }
.banniere-pause {
  width: 2.5rem;
  height: 2.5rem;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,.8);
  background: rgba(15,26,46,.7);
  color: #fff;
  font: inherit;
  font-size: .75rem;
  cursor: pointer;
}
.banniere-pause:hover, .entete-outils .toggle-es[aria-pressed="false"]:hover { background: rgba(15,26,46,.9); }
.entete-outils .toggle-es[aria-pressed="true"]:hover { background: #e8eef8; color: var(--bleu-fonce); }
@media (prefers-reduced-motion: reduce) {
  .entete-banniere { transition: none; }
  .banniere-piste { animation: none; width: auto; justify-content: center; }
  .banniere-serie + .banniere-serie, .banniere-serie .ban-msg ~ .ban-msg, .banniere-serie .ban-sep, .banniere-pause { display: none; }
  .ban-msg { white-space: normal; text-align: center; padding: .6rem 1rem; }
}


.hero {
  background: linear-gradient(135deg, var(--bleu) 0%, #2b4f8f 100%);
  color: #fff;
  border-radius: var(--rayon);
  padding: 2rem 1.5rem;
  margin-bottom: 1.5rem;
  position: relative;
  overflow: hidden;
}
.hero::after {
  content: "";
  position: absolute;
  right: 0; top: 0; bottom: 0;
  width: 10px;
  background: var(--rouge);
}
.hero h1 { color: #fff; }
.hero p { max-width: 68ch; }
.hero .es { color: #3d2a00; }

.grille {
  display: grid;
  gap: 1rem;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
}

.carte {
  background: var(--blanc);
  border: 1px solid var(--bord);
  border-radius: var(--rayon);
  padding: 1.1rem 1.2rem;
  box-shadow: var(--ombre);
  display: flex;
  flex-direction: column;
  gap: .4rem;
}
.carte h3 { margin: 0; }
.carte p { margin: 0; }
.carte .actions { margin-top: auto; padding-top: .6rem; }
.carte-lien { text-decoration: none; color: inherit; transition: transform .12s ease, border-color .12s; }
.carte-lien:hover { color: inherit; border-color: var(--bleu); transform: translateY(-2px); }

.niveaux-rapides { display: flex; flex-wrap: wrap; gap: .6rem; margin: 1rem 0; }
.btn-niveau {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  min-width: 5.5rem;
  padding: .7rem 1rem;
  border-radius: var(--rayon);
  background: #fff;
  border: 2px solid var(--bord);
  text-decoration: none;
  color: var(--bleu-fonce);
  font-weight: 700;
  font-size: 1.3rem;
}
.btn-niveau small { font-weight: 500; font-size: .75rem; color: var(--texte-doux); }
.btn-niveau:hover { border-color: var(--bleu); color: var(--bleu); }

/* Étiquettes */
.tags { display: flex; flex-wrap: wrap; gap: .35rem; }
.tag {
  display: inline-block;
  font-size: .78rem;
  font-weight: 600;
  padding: .12rem .55rem;
  border-radius: 999px;
  background: var(--bleu-clair);
  color: var(--bleu-fonce);
}
.tag-co { background: #e9e4f7; color: #3c2a7a; }
.tag-ce { background: #e2f1f1; color: #0f5050; }
.tag-ok { background: var(--vert-clair); color: var(--vert); }
.tag-attente { background: var(--orange-clair); color: var(--orange); }
.tag-ferme { background: #eceef2; color: #4a5468; }
.tag-rouge { background: var(--rouge-clair); color: var(--rouge); }

/* Boutons */
.btn {
  font: inherit;
  font-size: .95rem;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: .4rem;
  padding: .55rem 1.1rem;
  border-radius: 8px;
  border: 2px solid var(--bleu);
  background: var(--bleu);
  color: #fff;
  cursor: pointer;
  text-decoration: none;
  min-height: 44px;
}
.btn:hover { background: var(--bleu-fonce); border-color: var(--bleu-fonce); color: #fff; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-secondaire { background: #fff; color: var(--bleu); }
.btn-secondaire:hover { background: var(--bleu-clair); color: var(--bleu-fonce); }
.btn-rouge { background: var(--rouge); border-color: var(--rouge); }
.btn-rouge:hover { background: #8e0a1f; border-color: #8e0a1f; }
.btn-petit { min-height: 36px; padding: .3rem .8rem; font-size: .88rem; }

/* Filtres */
.filtres {
  display: flex;
  flex-wrap: wrap;
  gap: .8rem 1.2rem;
  align-items: flex-end;
  background: #fff;
  border: 1px solid var(--bord);
  border-radius: var(--rayon);
  padding: .9rem 1rem;
  margin: 1rem 0;
}
.filtres label { display: flex; flex-direction: column; font-size: .85rem; font-weight: 600; color: var(--texte-doux); gap: .25rem; }
.filtres select, .filtres input[type="search"] {
  font: inherit;
  font-size: .95rem;
  padding: .45rem .6rem;
  border: 1px solid #b8c1d1;
  border-radius: 6px;
  min-width: 10rem;
  min-height: 42px;
  background: #fff;
}
.filtres input[type="search"] { min-width: 16rem; }
.compteur { font-size: .9rem; color: var(--texte-doux); margin: .5rem 0; }

/* Tableau de bord */
.tableau-bord {
  background: #fff;
  border: 1px solid var(--bord);
  border-radius: var(--rayon);
  padding: 1rem 1.2rem;
  margin: 1rem 0 1.5rem;
}
.tableau-bord h2 { margin-top: 0; font-size: 1.15rem; }
.stats-niveaux {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: .7rem;
}
.stat {
  border: 1px solid var(--bord);
  border-radius: 8px;
  padding: .6rem .7rem;
  text-align: center;
}
.stat strong { display: block; font-size: 1.2rem; color: var(--bleu); }
.stat span { font-size: .82rem; color: var(--texte-doux); }
.barre { height: 6px; background: var(--bleu-clair); border-radius: 3px; margin-top: .4rem; overflow: hidden; }
.barre > i { display: block; height: 100%; background: var(--bleu); }
.tableau-bord .actions { margin-top: .8rem; display: flex; gap: .6rem; flex-wrap: wrap; align-items: center; }
.note-discrete { font-size: .85rem; color: var(--texte-doux); }

/* ---------- Exercice ---------- */

.exercice-entete {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 1rem;
  align-items: flex-start;
}
.consigne {
  background: var(--bleu-clair);
  border-left: 4px solid var(--bleu);
  padding: .8rem 1rem;
  border-radius: 0 8px 8px 0;
  margin: 1rem 0;
}
.consigne p { margin: 0; }
.consigne .es { margin-top: .5rem; }

.zone-exercice {
  display: grid;
  gap: 1.2rem;
  grid-template-columns: 1fr;
}
@media (min-width: 980px) {
  .zone-exercice.avec-document { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; }
  .zone-exercice.avec-document .document { position: sticky; top: 4.5rem; max-height: calc(100vh - 6rem); overflow: auto; }
}

.document {
  background: #fff;
  border: 1px solid var(--bord);
  border-radius: var(--rayon);
  padding: 1.2rem 1.4rem;
  font-family: var(--police-texte);
  font-size: 1.05rem;
  line-height: 1.7;
  box-shadow: var(--ombre);
}
.document h2 { font-family: var(--police); margin-top: 0; font-size: 1.15rem; }
.document .doc-meta { font-family: var(--police); font-size: .85rem; color: var(--texte-doux); margin-bottom: .6rem; }
.document p { margin: 0 0 .8rem; }

.lecteur p { margin: 0; }
.lecteur {
  background: #fff;
  border: 1px solid var(--bord);
  border-radius: var(--rayon);
  padding: 1rem 1.2rem;
  box-shadow: var(--ombre);
  display: flex;
  flex-direction: column;
  gap: .6rem;
}
.lecteur-ligne { display: flex; flex-wrap: wrap; gap: .8rem; align-items: center; }
.ecoutes { display: flex; gap: .3rem; }
.ecoutes i {
  width: 14px; height: 14px; border-radius: 50%;
  border: 2px solid var(--bleu);
  display: inline-block;
}
.ecoutes i.faite { background: var(--bleu); }
.lecteur-statut { font-size: .9rem; color: var(--texte-doux); }
.avertissement-tts {
  font-size: .85rem;
  background: var(--orange-clair);
  color: var(--orange);
  border-radius: 6px;
  padding: .35rem .6rem;
}
.onde { display: inline-flex; gap: 3px; align-items: flex-end; height: 18px; }
.onde i { width: 3px; background: var(--bleu); animation: onde 1s infinite ease-in-out; }
.onde i:nth-child(2) { animation-delay: .15s; }
.onde i:nth-child(3) { animation-delay: .3s; }
.onde i:nth-child(4) { animation-delay: .45s; }
@keyframes onde { 0%,100% { height: 4px; } 50% { height: 18px; } }
@media (prefers-reduced-motion: reduce) { .onde i { animation: none; height: 10px; } }

.minuteur {
  display: inline-flex;
  align-items: center;
  gap: .5rem;
  background: #fff;
  border: 1px solid var(--bord);
  border-radius: 999px;
  padding: .35rem .9rem;
  font-size: .9rem;
}
.minuteur output { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--bleu); }
.minuteur.urgent output { color: var(--rouge); }

.questions { display: flex; flex-direction: column; gap: 1rem; }
.question {
  background: #fff;
  border: 1px solid var(--bord);
  border-radius: var(--rayon);
  padding: 1rem 1.1rem;
  margin: 0;
}
.question legend, .question .enonce {
  font-weight: 600;
  padding: 0;
  margin-bottom: .5rem;
  display: flex;
  gap: .5rem;
  width: 100%;
}
fieldset.question legend { float: left; }
fieldset.question legend + * { clear: both; }
.question .num {
  flex: none;
  display: inline-grid;
  place-items: center;
  width: 1.7rem; height: 1.7rem;
  border-radius: 50%;
  background: var(--bleu);
  color: #fff;
  font-size: .85rem;
}
.question .pts { margin-left: auto; font-weight: 500; font-size: .82rem; color: var(--texte-doux); white-space: nowrap; }

.options { display: flex; flex-direction: column; gap: .35rem; }
.options.ligne { flex-direction: row; flex-wrap: wrap; gap: .5rem; }
.option {
  display: flex;
  align-items: center;
  gap: .6rem;
  border: 1px solid var(--bord);
  border-radius: 8px;
  padding: .5rem .7rem;
  cursor: pointer;
  min-height: 44px;
}
.option:hover { border-color: var(--bleu); }
.option input { width: 1.15rem; height: 1.15rem; accent-color: var(--bleu); flex: none; }
.option.juste { border-color: var(--vert); background: var(--vert-clair); }
.option.faux { border-color: var(--rouge); background: var(--rouge-clair); }

.champ {
  font: inherit;
  width: 100%;
  padding: .55rem .7rem;
  border: 1px solid #b8c1d1;
  border-radius: 8px;
  min-height: 44px;
}
textarea.champ { min-height: 5rem; resize: vertical; }
.champ-label { display: block; font-size: .88rem; font-weight: 600; color: var(--texte-doux); margin: .7rem 0 .25rem; }

.retour {
  margin-top: .7rem;
  border-radius: 8px;
  padding: .6rem .8rem;
  font-size: .95rem;
}
.retour.juste { background: var(--vert-clair); color: #134a28; border-left: 4px solid var(--vert); }
.retour.faux { background: var(--rouge-clair); color: #7a0a1b; border-left: 4px solid var(--rouge); }
.retour.neutre { background: var(--bleu-clair); color: var(--bleu-fonce); border-left: 4px solid var(--bleu); }
.retour p { margin: .2rem 0; }
.autoeval { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .5rem; align-items: center; }

.barre-validation {
  display: flex;
  flex-wrap: wrap;
  gap: .8rem;
  align-items: center;
  margin: 1.4rem 0;
}

.resultat {
  background: #fff;
  border: 2px solid var(--bleu);
  border-radius: var(--rayon);
  padding: 1.1rem 1.3rem;
  margin: 1.2rem 0;
}
.resultat h2 { margin: 0 0 .4rem; font-size: 1.2rem; }
.score-grand { font-size: 2rem; font-weight: 800; color: var(--bleu); }
.resultat .actions { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: .8rem; }

.transcription {
  background: #fff;
  border: 1px dashed var(--bleu);

(function () {

  /* Icônes (traits simples, couleur héritée du texte) */

  }
  var ICONES = {
    entrainement: svg('<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/>'),
    materiel: svg('<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/><path d="M9 7h6"/>'),
    groupe: svg('<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M8.5 11h.01M12 11h.01M15.5 11h.01"/>'),
    projets: svg('<path d="M5 15c-1.5 1.5-2 4-2 6 2 0 4.5-.5 6-2"/><path d="M9 15l-3-3 6-7c2-2 5-2.5 7-2-.5 2 0 5-2 7l-7 6z"/><circle cx="15" cy="9" r="1.5"/>'),
    evaluations: svg('<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1"/><path d="M9 12l2 2 4-4"/>'),
    CO: svg('<path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/>'),
    CE: svg('<path d="M3 5h6a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H3z"/><path d="M21 5h-6a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h7z"/>'),
    fleche: svg('<path d="M5 12h14M13 6l6 6-6 6"/>')
  };

  var CLE_PROGRESSION = "fle-progression-v1";
  var CLE_ES = "fle-espagnol";
  var app = document.getElementById("app");

  /* Nettoyage à chaque changement de page (audio, minuteurs…) */
  var nettoyages = [];
  function auNettoyage(fn) { nettoyages.push(fn); }
  function nettoyer() {
    while (nettoyages.length) {
      try { nettoyages.pop()(); } catch (e) { /* rien */ }
    }
  }

  /* ---------- Utilitaires ---------- */

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  /* Transforme un texte avec retours à la ligne en paragraphes */
  function paragraphes(texte) {
    return String(texte || "").split(/\n\s*\n/).map(function (p) {
      return "<p>" + esc(p).replace(/\n/g, "<br>") + "</p>";
    }).join("");
  }

  /* Bloc bilingue : français toujours visible, espagnol si activé */
  function bi(fr, es, balise) {
    balise = balise || "p";
    var h = "<" + balise + ">" + esc(fr) + "</" + balise + ">";
    if (es) h += '<p class="es" lang="es">' + esc(es) + "</p>";
    return h;
  }

  function normaliser(s) {
    return String(s || "").toLowerCase()
      .normalize("NFD").replace(/[̀-ͯ]/g, "")
      .replace(/[^a-z0-9]/g, "");
  }

  function stockage(cle, valeur) {
    try {
      if (valeur === undefined) return JSON.parse(localStorage.getItem(cle));
      if (valeur === null) localStorage.removeItem(cle);
      else localStorage.setItem(cle, JSON.stringify(valeur));
    } catch (e) { return null; }
    return null;
  }

  function tagNiveau(n) { return '<span class="tag tag-niv niv-' + esc(n) + '">' + esc(n) + "</span>"; }
  function tagCompetence(c) {
    return '<span class="tag tag-' + esc(String(c).toLowerCase()) + '">' + (ICONES[c] || "") + esc(c) + "</span>";
  }

  function formatDate(iso, avecHeure) {
    if (!iso) return "";
    var d = new Date(iso);
    if (isNaN(d)) return esc(iso);
    var opts = { day: "numeric", month: "long", year: "numeric" };
    if (avecHeure) { opts.hour = "2-digit"; opts.minute = "2-digit"; }
    return d.toLocaleString("fr-FR", opts);
  }

  function arrondi(x) { return Math.round(x * 10) / 10; }
  /* Nombre affiché à la française : 4,5 */
  function nb(x) { return String(arrondi(x)).replace(".", ","); }

  function listeNiveaux(v) {
    if (!v) return [];
    return Array.isArray(v) ? v : [v];
  }

  /* ---------- Chargement des données ---------- */

  function charger(url) {
    return fetch(url, { cache: "no-cache" }).then(function (r) {
      if (!r.ok) throw new Error(url + " (" + r.status + ")");
      return r.json();
    });
  }

  function sansAide(liste) {
    return (liste || []).filter(function (x) { return x && !x._aide_seulement; });
  }

  function chargerTout() {
    /* Version en un seul fichier : les données sont intégrées dans la page */
    if (window.DONNEES_SITE) {
      var D = window.DONNEES_SITE;
      DATA.site = D.site;
      DATA.exercices = sansAide(D.exercices);
      DATA.ressources = sansAide(D.ressources);
      DATA.groupes = sansAide(D.groupes);
      DATA.projets = sansAide(D.projets);
      DATA.evaluations = sansAide(D.evaluations);
      return Promise.resolve();
    }
    return charger("data/site.json").then(function (site) {
      DATA.site = site;
      var fichiers = site.fichiersExercices || [];
      return Promise.all([
        Promise.all(fichiers.map(function (f) {
          return charger(f).catch(function (e) { console.warn(e); return []; });
        })),
        charger("data/ressources.json").catch(function () { return []; }),
        charger("data/groupes.json").catch(function () { return []; }),
        charger("data/projets.json").catch(function () { return []; }),
        charger("data/evaluations.json").catch(function () { return []; })
      ]);
    }).then(function (r) {
      DATA.exercices = sansAide([].concat.apply([], r[0]));
      DATA.ressources = sansAide(r[1]);
      DATA.groupes = sansAide(r[2]);
      DATA.projets = sansAide(r[3]);
      DATA.evaluations = sansAide(r[4]);
    });
  }

  /* ---------- Progression (localStorage) ---------- */

  function progression() { return stockage(CLE_PROGRESSION) || {}; }

  function enregistrerResultat(ex, score, total) {
    var p = progression();
    var ancien = p[ex.id] || { tentatives: 0, meilleur: 0 };
    var pct = total ? score / total : 0;
    p[ex.id] = {
      niveau: ex.niveau,
      competence: ex.competence,
      dernier: arrondi(score),
      total: total,
      pourcentage: Math.round(pct * 100),
      meilleur: Math.max(ancien.meilleur || 0, Math.round(pct * 100)),
      tentatives: (ancien.tentatives || 0) + 1,
      date: new Date().toISOString()
    };
    stockage(CLE_PROGRESSION, p);
  }

  /* ---------- Routeur ---------- */

  function analyserHash() {
    var h = location.hash.replace(/^#\/?/, "");
    var parts = h.split("?");
    var chemin = parts[0].split("/").filter(Boolean);
    var params = {};
    if (parts[1]) {
      parts[1].split("&").forEach(function (kv) {
        var x = kv.split("=");
        params[decodeURIComponent(x[0])] = decodeURIComponent(x[1] || "");
      });
    }
    return { page: chemin[0] || "accueil", id: chemin[1] ? decodeURIComponent(chemin[1]) : null, params: params };
  }

  var PAGES = {
    accueil: pageAccueil,
    pratiques: pagePratiques,
    exercice: pageExercice,
    materiel: pageMateriel,
    messagerie: pageMessagerie,
    projets: pageProjets,
    evaluations: pageEvaluations
  };

  var SECTION_NAV = { exercice: "pratiques" };

  function router() {
    nettoyer();
    var r = analyserHash();
    var fn = PAGES[r.page] || pageIntrouvable;
    var actif = SECTION_NAV[r.page] || r.page;
    document.body.classList.toggle("page-accueil", r.page === "accueil" || !PAGES[r.page]);
    document.querySelectorAll(".main-nav a").forEach(function (a) {
      if (a.getAttribute("data-route") === actif) a.setAttribute("aria-current", "page");
      else a.removeAttribute("aria-current");
    });
    fn(r);
    var titre = app.querySelector("h1");
    document.title = (titre ? titre.textContent + " – " : "") + (DATA.site && DATA.site.titre || "Français Avancé");
    window.scrollTo(0, 0);
    var main = document.getElementById("main");
    if (main && r.page !== "accueil") main.focus({ preventScroll: true });
  }

  function pageIntrouvable() {
    app.innerHTML = "<h1>Page introuvable</h1><p><a href=\"#/\">Retour à l'accueil</a></p>";
  }

  /* ==========================================================
     ACCUEIL
     ========================================================== */

  function pageAccueil() {
    var s = DATA.site;
    var a = s.accueil || {};
    var noms = a.niveaux || {};
    var compte = {};
    DATA.exercices.forEach(function (e) { compte[e.niveau] = (compte[e.niveau] || 0) + 1; });
    var prog = progression();

    var h = '<section class="accueil-intro">' +
      "<h1>" + esc(a.titre || s.titre) + "</h1>" +
      '<p class="lead">' + esc(a.texte || "") + "</p>" +
      (a.texte_es ? '<p class="es" lang="es">' + esc(a.texte_es) + "</p>" : "") +
      "</section>";

    h += '<div class="tuiles-niveaux">';
    NIVEAUX.forEach(function (n) {
      var faits = DATA.exercices.filter(function (e) { return e.niveau === n && prog[e.id]; }).length;
      var total = compte[n] || 0;
      h += '<a class="tuile-niveau niv-' + n + '" href="#/pratiques?niveau=' + n + '">' +
        '<span class="tuile-code">' + n + "</span>" +
        '<span class="tuile-nom">' + esc(noms[n] || "") + "</span>" +
        '<span class="tuile-info">' + (n === "C1" ? "DALF" : "DELF") + " · " + total + " exercices</span>" +
        (faits ? '<span class="tuile-faits">' + faits + " / " + total + " faits</span>" : "") +
        '<span class="tuile-fleche">' + ICONES.fleche + "</span></a>";
    });
    h += "</div>";

    h += '<h2 class="titre-section">Sur ce site</h2><div class="grille grille-services">';
    (a.modeEmploi || []).forEach(function (m) {
      h += '<a class="carte carte-lien carte-service" href="' + esc(m.lien) + '">' +
        '<span class="pastille-icone">' + (ICONES[m.icone] || ICONES.fleche) + "</span>" +
        "<h3>" + esc(m.titre) + "</h3>" + bi(m.texte, m.texte_es) + "</a>";
    });
    h += "</div>";

    if (a.avertissement) {
      h += '<div class="encart info"><p>' + esc(a.avertissement) + "</p>" +
        (a.avertissement_es ? '<p class="es" lang="es">' + esc(a.avertissement_es) + "</p>" : "") + "</div>";
    }
    app.innerHTML = h;
  }

  /* ==========================================================
     PRATIQUES : liste + tableau de bord
     ========================================================== */

  function pagePratiques(r) {
    var niveau = r.params.niveau || "";
    var comp = r.params.competence || "";
    var s = DATA.site;

    var h = "<h1>Pratiques DELF/DALF – CO et CE</h1>" +
      bi("Entraînez-vous à la compréhension de l'oral et des écrits, du niveau A1 au niveau C1. Les documents sont des créations originales destinées à l'entraînement : ce ne sont pas des sujets officiels.",
        "Practique la comprensión oral y escrita, del nivel A1 al C1. Los documentos son creaciones originales para la práctica; no son exámenes oficiales.", "p");

    h += tableauDeBord();

    h += '<form class="filtres" id="filtres" role="search" aria-label="Filtrer les exercices">' +
      '<label>Niveau<select name="niveau"><option value="">Tous les niveaux</option>' +
      NIVEAUX.map(function (n) { return "<option" + (n === niveau ? " selected" : "") + ">" + n + "</option>"; }).join("") +
      "</select></label>" +
      '<label>Compétence<select name="competence"><option value="">CO et CE</option>' +
      Object.keys(COMPETENCES).map(function (c) {
        return '<option value="' + c + '"' + (c === comp ? " selected" : "") + ">" + c + " – " + COMPETENCES[c] + "</option>";
      }).join("") + "</select></label></form>";

    var liste = DATA.exercices.filter(function (e) {
      return (!niveau || e.niveau === niveau) && (!comp || e.competence === comp);

      var p = prog[e.id];

        '<p class="note-discrete">' + (e.questions || []).length + " questions" +

        (e.competence === "CO" ? " · " + (e.ecoutesMax || 2) + " écoute" + ((e.ecoutesMax || 2) > 1 ? "s" : "") : "") +
        "</p></a>";

      });

      if (c) q.push("competence=" + c);

  function tableauDeBord() {
    var prog = progression();

    if (!ids.length) {
      h += '<p class="note-discrete">Vous n\'avez encore fait aucun exercice sur cet appareil. Vos résultats apparaîtront ici.</p>';
    } else {
      h += '<div class="stats-niveaux">';
      NIVEAUX.forEach(function (n) {
        var total = DATA.exercices.filter(function (e) { return e.niveau === n; }).length;
        var faits = ids.filter(function (id) { return prog[id].niveau === n && DATA.exercices.some(function (e) { return e.id === id; }); });
        var moy = faits.length ? Math.round(faits.reduce(function (s, id) { return s + prog[id].meilleur; }, 0) / faits.length) : 0;
        h += '<div class="stat niv-' + n + '"><span>' + n + "</span><strong>" + faits.length + " / " + total + "</strong>" +
          "<span>" + (faits.length ? "moyenne " + moy + " %" : "—") + "</span>" +
          '<div class="barre" aria-hidden="true"><i style="width:' + (total ? Math.round(faits.length / total * 100) : 0) + '%"></i></div></div>';
      });
      h += "</div>";
    }
    h += '<div class="actions">' +
      (ids.length ? '<button type="button" class="btn btn-secondaire btn-petit" id="raz">Remettre à zéro ma progression</button>' : "") +
      '<span class="note-discrete">Les résultats sont enregistrés uniquement dans ce navigateur, sur cet appareil. Ils ne sont pas envoyés au professeur.</span></div>';
    h += "</section>";
    return h;
  }

  function brancherRaz() {
    var b = document.getElementById("raz");
    if (!b) return;
    var etape = 0;
    b.addEventListener("click", function () {
      if (etape === 0) {
        etape = 1;
        b.textContent = "Confirmer : tout effacer";
        b.classList.add("btn-rouge");
        b.classList.remove("btn-secondaire");
        setTimeout(function () {
          if (etape === 1 && document.body.contains(b)) {
            etape = 0; b.textContent = "Remettre à zéro ma progression";
            b.classList.remove("btn-rouge"); b.classList.add("btn-secondaire");
          }
        }, 5000);
      } else {
        stockage(CLE_PROGRESSION, null);
        router();
      }
    });
  }

  /* ==========================================================
     EXERCICE
     ========================================================== */

  function pageExercice(r) {
    var ex = DATA.exercices.filter(function (e) { return e.id === r.id; })[0];
    if (!ex) { pageIntrouvable(); return; }

    var aDocument = ex.competence === "CE" && ex.document;
    var questions = ex.questions || [];
    var total = questions.reduce(function (s, q) { return s + (Number(q.points) || 1); }, 0);

    var h = '<p class="breadcrumb"><a href="#/pratiques?niveau=' + esc(ex.niveau) + '">← Exercices ' + esc(ex.niveau) + "</a></p>";
    h += '<div class="exercice-entete niv-' + esc(ex.niveau) + '"><div>' +
      '<div class="tags">' + tagNiveau(ex.niveau) + tagCompetence(ex.competence) +
      '<span class="tag tag-ferme">' + (ex.niveau === "C1" ? "DALF" : "DELF") + "</span></div>" +
      "<h1>" + esc(ex.titre) + "</h1></div>";
    if (ex.dureeMinutes) {
      h += '<div class="minuteur" id="minuteur"><label><input type="checkbox" id="minuteur-on"> Minuteur</label>' +
        '<output id="minuteur-aff" aria-live="off">' + ex.dureeMinutes + ":00</output></div>";
    }
    h += "</div>";

    h += '<div class="consigne">' + bi(ex.consigne, ex.consigne_es) + "</div>";

    if (ex.competence === "CO") h += '<div id="lecteur"></div>';

    h += '<div class="zone-exercice' + (aDocument ? " avec-document" : "") + '">';
    if (aDocument) h += renduDocument(ex.document);
    h += '<form id="form-ex" class="questions" novalidate>';
    questions.forEach(function (q, i) { h += renduQuestion(q, i); });
    h += '<div class="barre-validation">' +
      '<button type="submit" class="btn btn-accent" id="valider">Valider mes réponses</button>' +
      '<span class="note-discrete">Total : ' + nb(total) + " point" + (total > 1 ? "s" : "") + "</span></div>";
    h += "</form></div>";
    h += '<div id="resultat"></div>';

    app.innerHTML = h;

    var etat = { valide: false, ex: ex, total: total, autoeval: {} };

    if (ex.competence === "CO") lecteurAudio(document.getElementById("lecteur"), ex);
    if (ex.dureeMinutes) minuteur(ex.dureeMinutes, function () {
      if (!etat.valide) valider(etat, true);
    });

    document.getElementById("form-ex").addEventListener("submit", function (e) {
      e.preventDefault();
      if (!etat.valide) valider(etat, false);
    });
  }

  function renduDocument(d) {
    if (d.type === "image") {
      return '<figure class="document"><img src="' + esc(d.src) + '" alt="' + esc(d.alt || "") + '">' +
        (d.titre ? "<figcaption>" + esc(d.titre) + "</figcaption>" : "") + "</figure>";
    }
    return '<article class="document" aria-label="Document support">' +
      (d.titre ? "<h2>" + esc(d.titre) + "</h2>" : "") +
      (d.source ? '<div class="doc-meta">' + esc(d.source) + "</div>" : "") +
      paragraphes(d.contenu) + "</article>";
  }

  function renduQuestion(q, i) {
    var n = "q" + i;
    var pts = Number(q.points) || 1;
    var entete = '<span class="num" aria-hidden="true">' + (i + 1) + "</span><span>" + esc(q.enonce) + "</span>" +
      '<span class="pts">' + nb(pts) + " pt" + (pts > 1 ? "s" : "") + "</span>";
    var h = "";

    if (q.type === "qcm") {
      h = '<fieldset class="question" id="' + n + '"><legend>' + entete + "</legend><div class=\"options\">";
      (q.options || []).forEach(function (o, j) {
        h += '<label class="option"><input type="radio" name="' + n + '" value="' + j + '"> <span>' + esc(o) + "</span></label>";
      });
      h += "</div></fieldset>";
    } else if (q.type === "vf" || q.type === "vfj") {
      var opts = [["vrai", "Vrai"], ["faux", "Faux"]];
      if (q.nsp) opts.push(["nsp", "On ne sait pas"]);
      h = '<fieldset class="question" id="' + n + '"><legend>' + entete + '</legend><div class="options ligne">';
      opts.forEach(function (o) {
        h += '<label class="option"><input type="radio" name="' + n + '" value="' + o[0] + '"> <span>' + o[1] + "</span></label>";
      });
      h += "</div>";
      if (q.type === "vfj") {
        h += '<label class="champ-label" for="' + n + '-j">Justification (citez le texte)</label>' +
          '<textarea class="champ" id="' + n + '-j" name="' + n + '-j" rows="2"></textarea>';
      }
      h += "</fieldset>";
    } else if (q.type === "courte") {
      h = '<div class="question" id="' + n + '"><label class="enonce" for="' + n + '-c">' + entete + "</label>" +
        '<input class="champ" type="text" id="' + n + '-c" name="' + n + '-c" autocomplete="off"></div>';
    } else if (q.type === "ouverte") {
      h = '<div class="question" id="' + n + '"><label class="enonce" for="' + n + '-o">' + entete + "</label>" +
        '<textarea class="champ" id="' + n + '-o" name="' + n + '-o" rows="3"></textarea></div>';
    }
    return h;
  }

  function valider(etat, tempsEcoule) {
    etat.valide = true;
    var ex = etat.ex;
    var form = document.getElementById("form-ex");
    var score = 0;
    var aAutoeval = false;

    (ex.questions || []).forEach(function (q, i) {
      var n = "q" + i;
      var bloc = document.getElementById(n);
      var pts = Number(q.points) || 1;
      var juste = false, neutre = false, msg = "";

      if (q.type === "qcm") {
        var c = form.querySelector('input[name="' + n + '"]:checked');
        var val = c ? Number(c.value) : -1;
        juste = val === q.reponse;
        bloc.querySelectorAll(".option").forEach(function (lab, j) {
          if (j === q.reponse) lab.classList.add("juste");
          else if (j === val) lab.classList.add("faux");
        });
        msg = juste ? "Bonne réponse." : "Réponse attendue : « " + q.options[q.reponse] + " ».";
      } else if (q.type === "vf" || q.type === "vfj") {
        var c2 = form.querySelector('input[name="' + n + '"]:checked');
        var v = c2 ? c2.value : "";
        var libelle = { vrai: "Vrai", faux: "Faux", nsp: "On ne sait pas" };
        bloc.querySelectorAll(".option").forEach(function (lab) {
          var inp = lab.querySelector("input");
          if (inp.value === q.reponse) lab.classList.add("juste");
          else if (inp.value === v) lab.classList.add("faux");
        });
        var vfJuste = v === q.reponse;
        if (q.type === "vf") {
          juste = vfJuste;
          msg = juste ? "Bonne réponse." : "Réponse attendue : " + libelle[q.reponse] + ".";
        } else {
          neutre = true;
          aAutoeval = true;
          msg = (vfJuste ? "Vrai/Faux correct. " : "Vrai/Faux incorrect (réponse : " + libelle[q.reponse] + "). ") +
            "Justification attendue : « " + (q.justification || "") + " »";
          etat.autoeval[n] = { pts: pts, vfJuste: vfJuste, choisi: null };
        }
      } else if (q.type === "courte") {
        var saisie = (form.querySelector('[name="' + n + '-c"]') || {}).value || "";
        var attendues = q.reponses || [];
        juste = attendues.some(function (a) { return normaliser(a) === normaliser(saisie); }) && normaliser(saisie) !== "";
        msg = juste ? "Bonne réponse." : "Réponse attendue : " + attendues[0] + ".";
      } else if (q.type === "ouverte") {
        neutre = true;
        aAutoeval = true;
        msg = "Réponse modèle : " + (q.reponseModele || "");
        etat.autoeval[n] = { pts: pts, vfJuste: true, choisi: null };
      }

      if (!neutre && juste) score += pts;

      var cl = neutre ? "neutre" : (juste ? "juste" : "faux");
      var retour = '<div class="retour ' + cl + '" role="note"><p><strong>' +
        (neutre ? "À vous d'évaluer" : (juste ? "✔ Correct" : "✘ Incorrect")) + "</strong> – " + esc(msg) + "</p>" +
        (q.explication ? "<p>" + esc(q.explication) + "</p>" : "");
      if (neutre) {
        var cond = q.type === "vfj" ? "Les points ne sont accordés que si le vrai/faux ET la justification sont corrects." : "Comparez votre réponse avec la réponse modèle.";
        retour += "<p class=\"note-discrete\">" + cond + "</p>" +
          '<div class="autoeval" data-q="' + n + '">' +
          '<button type="button" class="btn btn-petit" data-ok="1">Ma réponse est correcte</button>' +
          '<button type="button" class="btn btn-secondaire btn-petit" data-ok="0">Ma réponse est incorrecte</button></div>';
      }
      retour += "</div>";
      bloc.insertAdjacentHTML("beforeend", retour);
    });

    form.querySelectorAll("input, textarea").forEach(function (el) { el.disabled = true; });
    document.getElementById("valider").disabled = true;

    etat.scoreAuto = score;
    afficherResultat(etat, tempsEcoule, aAutoeval);

    form.querySelectorAll(".autoeval").forEach(function (div) {
      div.addEventListener("click", function (e) {
        var b = e.target.closest("button");
        if (!b) return;
        var a = etat.autoeval[div.getAttribute("data-q")];
        a.choisi = b.getAttribute("data-ok") === "1";
        div.querySelectorAll("button").forEach(function (x) {
          x.setAttribute("aria-pressed", x === b ? "true" : "false");
          x.className = "btn btn-petit" + (x === b ? "" : " btn-secondaire");
        });
        afficherResultat(etat, tempsEcoule, true);
      });
    });

    if (ex.competence === "CO" && ex.transcription) {
      document.getElementById("resultat").insertAdjacentHTML("beforeend",
        '<details class="transcription"><summary><strong>Afficher la transcription</strong></summary>' +
        paragraphes(ex.transcription) + "</details>");
    }
  }

  function afficherResultat(etat, tempsEcoule, aAutoeval) {
    var score = etat.scoreAuto;
    var enAttente = 0;
    Object.keys(etat.autoeval).forEach(function (k) {
      var a = etat.autoeval[k];
      if (a.choisi === null) enAttente++;
      else if (a.choisi && a.vfJuste) score += a.pts;
    });
    var total = etat.total;
    var pct = total ? Math.round(score / total * 100) : 0;
    var sur25 = total ? arrondi(score / total * 25) : 0;

    var h = '<section class="resultat" aria-live="polite"><h2>Votre résultat</h2>' +
      (tempsEcoule ? '<p class="tag tag-rouge">Temps écoulé : vos réponses ont été validées automatiquement.</p>' : "") +
      '<div class="score-grand">' + nb(score) + " / " + nb(total) + " <small>(" + pct + " %)</small></div>" +
      "<p>Projection sur le barème de l'épreuve : <strong>" + nb(sur25) + " / 25</strong>. " +
      '<span class="note-discrete">Indication seulement : une épreuve réelle comporte plusieurs exercices.</span></p>';
    if (enAttente) {
      h += '<p class="tag tag-attente">' + enAttente + " réponse" + (enAttente > 1 ? "s" : "") + " à auto-évaluer ci-dessus</p>";
    }
    h += '<div class="actions"><a class="btn" href="#/exercice/' + encodeURIComponent(etat.ex.id) + '" id="refaire">Refaire l\'exercice</a>' +
      '<a class="btn btn-secondaire" href="#/pratiques?niveau=' + esc(etat.ex.niveau) + '">Autres exercices ' + esc(etat.ex.niveau) + "</a></div></section>";

    var zone = document.getElementById("resultat");
    var trans = zone.querySelector(".transcription");
    zone.innerHTML = h;
    if (trans) zone.appendChild(trans);

    var refaire = document.getElementById("refaire");
    refaire.addEventListener("click", function (e) { e.preventDefault(); router(); });

    if (!etat.enregistre) {
      enregistrerResultat(etat.ex, score, total);
      etat.enregistre = true;
    } else {
      /* Auto-évaluation : mise à jour du score sans compter une nouvelle tentative */
      var p = progression();
      if (p[etat.ex.id]) {
        p[etat.ex.id].dernier = arrondi(score);
        p[etat.ex.id].pourcentage = pct;
        p[etat.ex.id].meilleur = Math.max(p[etat.ex.id].meilleur, pct);
        stockage(CLE_PROGRESSION, p);
      }
    }
    if (!etat.scrolled) { zone.scrollIntoView({ behavior: "smooth", block: "start" }); etat.scrolled = true; }
  }

  /* ---------- Minuteur optionnel ---------- */

  function minuteur(minutes, finCallback) {
    var box = document.getElementById("minuteur");
    var chk = document.getElementById("minuteur-on");
    var aff = document.getElementById("minuteur-aff");
    var reste = minutes * 60, t = null;
    function afficher() {
      var m = Math.floor(reste / 60), s = reste % 60;
      aff.textContent = m + ":" + (s < 10 ? "0" : "") + s;
      box.classList.toggle("urgent", reste <= 60);
    }
    chk.addEventListener("change", function () {
      if (chk.checked) {
        chk.disabled = true;
        t = setInterval(function () {
          reste--;
          afficher();
          if (reste === 60) aff.setAttribute("aria-live", "assertive");
          if (reste <= 0) { clearInterval(t); finCallback(); }
        }, 1000);
      }
    });
    auNettoyage(function () { if (t) clearInterval(t); });
  }

  /* ---------- Lecteur audio à écoutes limitées ---------- */

  function lecteurAudio(conteneur, ex) {
    var max = ex.ecoutesMax || 2;
    var lecture = ex.tempsLecture || 0;
    var faites = 0, enCours = false, modeTTS = false, audio = null, indisponible = false, detruit = false;

    var niveauVitesse = { A1: 0.82, A2: 0.88, B1: 0.95, B2: 1, C1: 1 };

    conteneur.innerHTML = '<div class="lecteur" role="region" aria-label="Lecteur audio">' +
      '<div class="lecteur-ligne">' +
      '<button type="button" class="btn" id="btn-ecoute" disabled>▶ Écouter</button>' +
      '<span class="ecoutes" aria-hidden="true">' + new Array(max + 1).join("<i></i>") + "</span>" +
      '<span class="lecteur-statut" id="statut-ecoute" aria-live="polite"></span>' +
      "</div>" +
      '<p class="note-discrete">Nombre d\'écoutes autorisées : <strong>' + max + "</strong>. Vous ne pouvez pas mettre en pause ni revenir en arrière, comme le jour de l'examen.</p>" +
      '<div id="zone-tts"></div></div>';

    var btn = document.getElementById("btn-ecoute");
    var statut = document.getElementById("statut-ecoute");
    var pastilles = conteneur.querySelectorAll(".ecoutes i");

    function activerModeTTS() {
      if (modeTTS) return;
      modeTTS = true;
      var ok = "speechSynthesis" in window && ex.transcription;
      document.getElementById("zone-tts").innerHTML = ok
        ? '<p class="avertissement-tts">Démonstration : l\'enregistrement audio n\'a pas encore été ajouté. Le texte est lu par la voix de synthèse de votre navigateur.</p>'
        : '<p class="avertissement-tts">L\'enregistrement audio de cet exercice n\'est pas disponible.</p>';
      if (!ok) { indisponible = true; btn.disabled = true; }
    }

    if (ex.audio) {
      audio = new Audio();
      audio.preload = "auto";
      audio.addEventListener("error", function () { if (!detruit) activerModeTTS(); });
      audio.addEventListener("ended", finEcoute);
      audio.src = ex.audio;
    } else {
      activerModeTTS();
    }

    function majPastilles() {
      pastilles.forEach(function (p, i) { p.classList.toggle("faite", i < faites); });
    }

    function finEcoute() {
      enCours = false;
      faites++;
      majPastilles();
      if (faites >= max) {
        btn.disabled = true;
        btn.textContent = "Écoutes terminées";
        statut.textContent = "Vous avez utilisé toutes vos écoutes. Terminez vos réponses.";
      } else {
        btn.disabled = false;
        btn.textContent = "▶ Écoute " + (faites + 1) + " / " + max;
        statut.textContent = "Écoute " + faites + " terminée.";
      }
    }

    function voixFrancaise() {
      var voix = window.speechSynthesis.getVoices() || [];
      return voix.filter(function (v) { return /^fr(-|_)FR/i.test(v.lang); })[0] ||
        voix.filter(function (v) { return /^fr/i.test(v.lang); })[0] || null;
    }

    function lireTTS() {
      var synth = window.speechSynthesis;
      synth.cancel();
      var u = new SpeechSynthesisUtterance(ex.transcription.replace(/[—–]\s*/g, ""));
      u.lang = "fr-FR";
      var v = voixFrancaise();
      if (v) u.voice = v;
      u.rate = niveauVitesse[ex.niveau] || 1;
      u.onend = function () { if (!detruit) finEcoute(); };
      u.onerror = function () { if (enCours && !detruit) finEcoute(); };
      synth.speak(u);
    }

    btn.addEventListener("click", function () {
      if (enCours || faites >= max) return;
      enCours = true;
      btn.disabled = true;
      btn.innerHTML = '<span class="onde" aria-hidden="true"><i></i><i></i><i></i><i></i></span> Lecture en cours…';
      statut.textContent = "Écoute " + (faites + 1) + " sur " + max + ".";
      if (!modeTTS && audio) {
        audio.currentTime = 0;
        var p = audio.play();
        if (p && p.catch) p.catch(function () {
          activerModeTTS();
          if (!indisponible) lireTTS();
          else { enCours = false; btn.textContent = "Audio indisponible"; }
        });
      } else {
        lireTTS();
      }
    });

    /* Temps de lecture des questions avant la première écoute */
    if (lecture > 0) {
      var reste = lecture;
      statut.innerHTML = "Lisez les questions : <strong>" + reste + " s</strong> ";
      var passer = document.createElement("button");
      passer.type = "button";
      passer.className = "btn btn-secondaire btn-petit";
      passer.textContent = "Je suis prêt(e)";
      conteneur.querySelector(".lecteur-ligne").appendChild(passer);
      var t = setInterval(function () {
        reste--;
        if (reste <= 0) { fin(); return; }
        statut.innerHTML = "Lisez les questions : <strong>" + reste + " s</strong>";
      }, 1000);
      var fin = function () {
        clearInterval(t);
        if (passer.parentNode) passer.parentNode.removeChild(passer);
        statut.textContent = "Vous pouvez lancer l'écoute.";
        if (!indisponible) btn.disabled = false;
      };
      passer.addEventListener("click", fin);
      auNettoyage(function () { clearInterval(t); });
    } else if (!indisponible) {
      btn.disabled = false;
    }

    auNettoyage(function () {
      detruit = true;
      if (audio) { audio.pause(); audio.removeAttribute("src"); audio.load(); }
      if ("speechSynthesis" in window) window.speechSynthesis.cancel();
    });
  }

  /* ==========================================================
     MATÉRIEL PÉDAGOGIQUE

  function pageMateriel(r) {
    var types = [];
    var comps = [];
    DATA.ressources.forEach(function (x) {
      if (x.type && types.indexOf(x.type) < 0) types.push(x.type);
      if (x.competence && x.competence !== "Toutes" && comps.indexOf(x.competence) < 0) comps.push(x.competence);
    });
    types.sort(); comps.sort();

    var h = "<h1>Matériel pédagogique</h1>" +
      bi("Fiches, documents et liens utiles pour travailler en autonomie.",
        "Fichas, documentos y enlaces útiles para trabajar de forma autónoma.");
    h += '<form class="filtres" id="filtres-mat" role="search" aria-label="Filtrer les ressources">' +
      '<label>Rechercher<input type="search" name="q" placeholder="Mot-clé…"></label>' +
      '<label>Niveau<select name="niveau"><option value="">Tous</option>' +
      NIVEAUX.map(function (n) { return "<option>" + n + "</option>"; }).join("") + "</select></label>" +
      '<label>Compétence<select name="competence"><option value="">Toutes</option>' +
      comps.map(function (c) { return "<option>" + esc(c) + "</option>"; }).join("") + "</select></label>" +
      '<label>Type<select name="type"><option value="">Tous</option>' +
      types.map(function (t) { return "<option>" + esc(t) + "</option>"; }).join("") + "</select></label></form>" +
      '<p class="compteur" id="compteur-mat" role="status"></p><div class="grille" id="liste-mat"></div>';
    app.innerHTML = h;

    var f = document.getElementById("filtres-mat");
    function filtrer() {
      var q = normaliser(f.q.value);
      var n = f.niveau.value, c = f.competence.value, t = f.type.value;
      var liste = DATA.ressources.filter(function (x) {
        var niv = listeNiveaux(x.niveau);
        if (n && niv.indexOf(n) < 0 && niv.indexOf("Tous") < 0) return false;
        if (c && x.competence !== c && x.competence !== "Toutes") return false;
        if (t && x.type !== t) return false;
        if (q && normaliser([x.titre, x.description, x.type, x.competence, x.source].join(" ")).indexOf(q) < 0) return false;
        return true;
      });
      document.getElementById("compteur-mat").textContent = liste.length + " ressource" + (liste.length > 1 ? "s" : "");
      document.getElementById("liste-mat").innerHTML = liste.length ? liste.map(function (x) {
        var lien = x.lien
          ? '<a class="btn btn-petit" href="' + esc(x.lien) + '" target="_blank" rel="noopener">Ouvrir ↗<span class="sr-only"> (nouvel onglet)</span></a>'
          : '<span class="tag tag-attente">Lien à ajouter</span>';
        return '<article class="carte"><div class="tags">' +
          listeNiveaux(x.niveau).map(tagNiveau).join("") +
          (x.competence ? '<span class="tag tag-ferme">' + esc(x.competence) + "</span>" : "") +
          (x.type ? '<span class="tag tag-rouge">' + esc(x.type) + "</span>" : "") + "</div>" +
          "<h3>" + esc(x.titre) + "</h3><p>" + esc(x.description) + "</p>" +
          (x.source ? '<p class="note-discrete">Source : ' + esc(x.source) + "</p>" : "") +
          '<div class="actions">' + lien + "</div></article>";
      }).join("") : '<p class="vide">Aucune ressource ne correspond à votre recherche.</p>';
    }
    f.addEventListener("input", filtrer);
    f.addEventListener("submit", function (e) { e.preventDefault(); });
    filtrer();
  }

      h += '<a class="carte carte-lien" href="#/messagerie/' + encodeURIComponent(g.id) + '">' +
        '<div class="tags">' + (g.horaire ? '<span class="tag">' + esc(g.horaire) + "</span>" : "") +
        (nb ? '<span class="tag tag-rouge">' + nb + " annonce" + (nb > 1 ? "s" : "") + "</span>" : "") + "</div>" +
        "<h3>" + esc(g.nom) + "</h3><p>" + esc(g.description || "") + "</p></a>";
    });
    h += "</div>";
    h += '<div class="encart attention"><p><strong>Règles de la messagerie :</strong> écrivez en français, restez respectueux, ne publiez pas de données personnelles (téléphone, adresse, photos d\'autres personnes).</p>' +
      '<p class="es" lang="es">Escriba en francés, sea respetuoso y no publique datos personales.</p></div>';
    app.innerHTML = h;
  }

  function pageGroupe(id) {
    var g = DATA.groupes.filter(function (x) { return x.id === id; })[0];
    if (!g) { pageIntrouvable(); return; }
    var h = '<p class="breadcrumb"><a href="#/messagerie">← Tous les groupes</a></p>' +
      "<h1>" + esc(g.nom) + "</h1>" + (g.description ? '<p class="lead">' + esc(g.description) + "</p>" : "");

    var annonces = (g.annonces || []).slice().sort(function (a, b) { return String(b.date).localeCompare(String(a.date)); });
    h += "<h2>Annonces</h2>";
    if (!annonces.length) h += '<p class="vide">Pas d\'annonce pour le moment.</p>';
    h += '<div class="annonces">';
    annonces.forEach(function (a) {
      h += '<article class="annonce"><time datetime="' + esc(a.date) + '">' + formatDate(a.date) + "</time>" +
        "<h3>" + esc(a.titre) + "</h3>" + paragraphes(a.texte) +
        (a.texte_es ? '<p class="es" lang="es">' + esc(a.texte_es) + "</p>" : "") + "</article>";
    });
    h += "</div>";

    h += "<h2>Espace d'échange" + (g.service ? " – " + esc(g.service) : "") + "</h2>";
    var integ = g.integration || "iframe";
    if (integ === "giscus" && g.giscus && g.giscus.repo) {
      h += '<div class="encart info"><p>Pour écrire un message, connectez-vous avec votre compte GitHub.</p></div><div id="giscus-zone" class="cadre-integre" style="padding:1rem"></div>';
    } else if (!g.url) {
      h += '<div class="encart attention"><p>L\'espace d\'échange de ce groupe n\'est pas encore configuré.</p></div>';
    } else if (integ === "lien") {
      h += '<p><a class="btn" href="' + esc(g.url) + '" target="_blank" rel="noopener">Ouvrir l\'espace du groupe sur ' + esc(g.service || "le service") + " ↗</a></p>";
    } else {
      h += '<div class="cadre-integre"><iframe src="' + esc(g.url) + '" title="Messagerie ' + esc(g.nom) + '" loading="lazy" allow="clipboard-write" allowfullscreen></iframe></div>' +
        '<p class="note-discrete">Si l\'espace ne s\'affiche pas, <a href="' + esc(g.url) + '" target="_blank" rel="noopener">ouvrez-le dans un nouvel onglet</a>.</p>';
    }
    app.innerHTML = h;

    if (integ === "giscus" && g.giscus && g.giscus.repo) {
      var s = document.createElement("script");
      s.src = "https://giscus.app/client.js";
      s.async = true;
      s.crossOrigin = "anonymous";
      var cfg = {
        "data-repo": g.giscus.repo,
        "data-repo-id": g.giscus.repoId,
        "data-category": g.giscus.categorie,
        "data-category-id": g.giscus.categorieId,
        "data-mapping": "specific",
        "data-term": g.giscus.terme || g.id,
        "data-reactions-enabled": "1",
        "data-input-position": "top",
        "data-theme": "light",
        "data-lang": "fr"
      };
      Object.keys(cfg).forEach(function (k) { s.setAttribute(k, cfg[k]); });
      document.getElementById("giscus-zone").appendChild(s);
    }
  }

  /* ==========================================================
     PROJETS
     ========================================================== */

  function pageProjets(r) {
    if (r.id) { pageProjet(r.id); return; }
    var h = "<h1>Projets</h1>" +
      bi("Des projets menés selon la perspective actionnelle : chaque projet aboutit à une tâche finale concrète, réalisée en groupe.",
        "Proyectos según el enfoque accional: cada proyecto termina con una tarea final concreta, realizada en grupo.");
    if (!DATA.projets.length) h += '<p class="vide">Aucun projet pour le moment.</p>';
    h += '<div class="grille">';
    DATA.projets.forEach(function (p) {
      h += '<a class="carte carte-lien" href="#/projets/' + encodeURIComponent(p.id) + '">' +
        '<div class="tags">' + listeNiveaux(p.niveau).map(tagNiveau).join("") +
        (p.statut ? '<span class="tag tag-ok">' + esc(p.statut) + "</span>" : "") + "</div>" +
        "<h3>" + esc(p.titre) + "</h3><p>" + esc(p.resume || "") + "</p>" +
        (p.duree ? '<p class="note-discrete">Durée : ' + esc(p.duree) + "</p>" : "") + "</a>";
    });
    h += "</div>";
    app.innerHTML = h;
  }

  function pageProjet(id) {
    var p = DATA.projets.filter(function (x) { return x.id === id; })[0];
    if (!p) { pageIntrouvable(); return; }
    var h = '<p class="breadcrumb"><a href="#/projets">← Tous les projets</a></p>' +
      '<div class="tags">' + listeNiveaux(p.niveau).map(tagNiveau).join("") + "</div>" +
      "<h1>" + esc(p.titre) + "</h1>" + (p.resume ? '<p class="lead">' + esc(p.resume) + "</p>" : "");

    h += '<div class="encart info"><h2 style="margin-top:0">Tâche finale</h2>' + paragraphes(p.tacheFinale) +
      (p.tacheFinale_es ? '<p class="es" lang="es">' + esc(p.tacheFinale_es) + "</p>" : "") + "</div>";

    h += '<div class="deux-colonnes"><section><h2>Objectifs (CECRL)</h2><ul>' +
      (p.objectifs || []).map(function (o) { return "<li>" + esc(o) + "</li>"; }).join("") + "</ul></section>" +
      "<section><h2>Livrables</h2><ul>" +
      (p.livrables || []).map(function (o) { return "<li>" + esc(o) + "</li>"; }).join("") + "</ul>" +
      (p.duree ? '<dl class="fiche"><dt>Durée</dt><dd>' + esc(p.duree) + "</dd>" + (p.modalite ? "<dt>Modalité</dt><dd>" + esc(p.modalite) + "</dd>" : "") + "</dl>" : "") +
      "</section></div>";

    if (p.etapes && p.etapes.length) {
      h += '<h2>Étapes et calendrier</h2><ol class="etapes">';
      p.etapes.forEach(function (e) {
        h += "<li><strong>" + esc(e.titre) + (e.quand ? " · " + esc(e.quand) : "") + "</strong>" + esc(e.description || "") + "</li>";
      });
      h += "</ol>";
    }

    if (p.grille && p.grille.criteres) {
      var tot = p.grille.criteres.reduce(function (s, c) { return s + (Number(c.points) || 0); }, 0);
      h += '<section id="grille-impr"><h2>Grille d\'évaluation</h2>' +
        '<div class="tableau-wrap"><table class="grille-eval"><caption class="sr-only">Grille d\'évaluation du projet</caption>' +
        '<thead><tr><th scope="col">Critère</th><th scope="col">Descripteur</th><th scope="col">Points</th><th scope="col">Note</th></tr></thead><tbody>';
      p.grille.criteres.forEach(function (c) {
        h += "<tr><th scope=\"row\">" + esc(c.critere) + "</th><td>" + esc(c.descripteur) + "</td><td>" + esc(c.points) + "</td><td></td></tr>";
      });
      h += '</tbody><tfoot><tr><td colspan="2">Total</td><td>' + tot + "</td><td></td></tr></tfoot></table></div></section>" +
        '<p class="no-print" style="margin-top:1rem;display:flex;gap:.6rem;flex-wrap:wrap">' +
        '<button type="button" class="btn" id="imprimer">Imprimer / enregistrer la grille en PDF</button>' +
        (p.grille.fichier ? '<a class="btn btn-secondaire" href="' + esc(p.grille.fichier) + '" download>Télécharger la grille</a>' : "") + "</p>";
    }
    app.innerHTML = h;
    var b = document.getElementById("imprimer");
    if (b) b.addEventListener("click", function () { window.print(); });
  }

  /* ==========================================================
     ÉVALUATIONS (Google Forms / Microsoft Forms)
     ========================================================== */

  function statutEval(e) {
    var maintenant = new Date();
    var o = e.ouverture ? new Date(e.ouverture) : null;
    var f = e.fermeture ? new Date(e.fermeture) : null;
    if (o && maintenant < o) return "avenir";
    if (f && maintenant > f) return "fermee";
    return "ouverte";
  }

  var LIBELLE_STATUT = {
    ouverte: '<span class="tag tag-ok">Ouverte</span>',
    avenir: '<span class="tag tag-attente">À venir</span>',
    fermee: '<span class="tag tag-ferme">Fermée</span>'
  };

  function urlIntegration(e) {
    var u = e.url || "";
    if (!u) return "";
    if (/docs\.google\.com\/forms/.test(u) && !/embedded=true/.test(u)) {
      u += (u.indexOf("?") < 0 ? "?" : "&") + "embedded=true";
    }
    if (/forms\.(office|microsoft)\.com/.test(u) && !/embed=true/.test(u)) {
      u += (u.indexOf("?") < 0 ? "?" : "&") + "embed=true";
    }
    return u;
  }

  function pageEvaluations(r) {
    if (r.id) { pageEvaluation(r.id); return; }
    var h = "<h1>Évaluations</h1>" +
      bi("Les évaluations de compréhension de l'oral et des écrits se font avec un formulaire en ligne. Elles ne sont accessibles que pendant leur période d'ouverture.",
        "Las evaluaciones de comprensión oral y escrita se hacen con un formulario en línea. Solo están disponibles durante su período de apertura.");
    var ordre = { ouverte: 0, avenir: 1, fermee: 2 };
    var liste = DATA.evaluations.slice().sort(function (a, b) {
      return ordre[statutEval(a)] - ordre[statutEval(b)] || String(a.ouverture).localeCompare(String(b.ouverture));
    });
    if (!liste.length) h += '<p class="vide">Aucune évaluation programmée.</p>';
    h += '<div class="grille">';
    liste.forEach(function (e) {
      var st = statutEval(e);
      h += '<article class="carte"><div class="tags">' + LIBELLE_STATUT[st] + tagNiveau(e.niveau) + tagCompetence(e.competence) + "</div>" +
        "<h3>" + esc(e.titre) + "</h3>" +
        '<dl class="fiche"><dt>Ouverture</dt><dd>' + formatDate(e.ouverture, true) + "</dd>" +
        "<dt>Fermeture</dt><dd>" + formatDate(e.fermeture, true) + "</dd>" +
        (e.dureeMinutes ? "<dt>Durée</dt><dd>" + esc(e.dureeMinutes) + " min</dd>" : "") +
        (e.groupe ? "<dt>Groupe</dt><dd>" + esc(e.groupe) + "</dd>" : "") + "</dl>" +
        '<div class="actions">' + (st === "ouverte"
          ? '<a class="btn btn-petit" href="#/evaluations/' + encodeURIComponent(e.id) + '">Commencer</a>'
          : '<a class="btn btn-secondaire btn-petit" href="#/evaluations/' + encodeURIComponent(e.id) + '">Détails</a>') +
        "</div></article>";
    });
    h += "</div>";
    app.innerHTML = h;
  }

  function pageEvaluation(id) {
    var e = DATA.evaluations.filter(function (x) { return x.id === id; })[0];
    if (!e) { pageIntrouvable(); return; }
    var st = statutEval(e);
    var h = '<p class="breadcrumb"><a href="#/evaluations">← Toutes les évaluations</a></p>' +
      '<div class="tags">' + LIBELLE_STATUT[st] + tagNiveau(e.niveau) + tagCompetence(e.competence) + "</div>" +
      "<h1>" + esc(e.titre) + "</h1>" +
      '<dl class="fiche"><dt>Ouverture</dt><dd>' + formatDate(e.ouverture, true) + "</dd>" +
      "<dt>Fermeture</dt><dd>" + formatDate(e.fermeture, true) + "</dd>" +
      (e.dureeMinutes ? "<dt>Durée conseillée</dt><dd>" + esc(e.dureeMinutes) + " min</dd>" : "") +
      "<dt>Plateforme</dt><dd>" + (e.plateforme === "microsoft" ? "Microsoft Forms" : "Google Forms") + "</dd></dl>";
    if (e.consignes) h += '<div class="consigne">' + bi(e.consignes, e.consignes_es) + "</div>";

    if (st === "avenir") {
      h += '<div class="encart attention"><p>Cette évaluation n\'est pas encore ouverte. Revenez le ' + formatDate(e.ouverture, true) + ".</p></div>";
    } else if (st === "fermee") {
      h += '<div class="encart"><p>Cette évaluation est fermée depuis le ' + formatDate(e.fermeture, true) + ".</p></div>";
    } else if (!e.url) {
      h += '<div class="encart attention"><p>Le formulaire de cette évaluation n\'a pas encore été ajouté par le professeur.</p></div>';
    } else {
      var u = urlIntegration(e);
      h += '<div class="cadre-integre"><iframe src="' + esc(u) + '" title="Formulaire : ' + esc(e.titre) + '" loading="lazy" allowfullscreen>Chargement…</iframe></div>' +
        '<p class="note-discrete">Si le formulaire ne s\'affiche pas, <a href="' + esc(e.url) + '" target="_blank" rel="noopener">ouvrez-le dans un nouvel onglet</a>.</p>';
    }
    app.innerHTML = h;
  }

  /* ==========================================================
     Initialisation
     ========================================================== */

  function initEspagnol() {
    var b = document.getElementById("toggle-es");
    function appliquer(on) {
      document.body.classList.toggle("show-es", on);
      b.setAttribute("aria-pressed", on ? "true" : "false");
    }
    appliquer(!!stockage(CLE_ES));
    b.addEventListener("click", function () {
      var on = !document.body.classList.contains("show-es");
      appliquer(on);
      stockage(CLE_ES, on);
    });
  }

  /* Bannière d'en-tête : image + message défilant (grande sur l'accueil, compacte ailleurs) */
  function initBanniere() {
    var s = DATA.site;
    var ban = (s.accueil || {}).banniere;
    var zone = document.getElementById("entete-banniere");
    if (!zone || !ban || !ban.image) return;
    var msg = esc(ban.message || s.titre);
    var item = '<span class="ban-msg">' + msg + '</span><span class="ban-sep" aria-hidden="true">◆</span>';
    var serie = new Array(5).join(item);
    zone.insertAdjacentHTML("afterbegin",
      '<a class="banniere-lien" href="#/" aria-label="Accueil – ' + msg + '">' +
      '<img class="banniere-img" src="' + esc(ban.image) + '" alt="' + esc(ban.alt || "") + '" onerror="this.style.visibility=\'hidden\'">' + "</a>" +
      '<div class="banniere-bandeau" aria-hidden="true"><div class="banniere-piste">' +
      '<div class="banniere-serie">' + serie + '</div><div class="banniere-serie">' + serie + "</div>" +
      "</div></div>");
    zone.querySelector(".entete-outils").insertAdjacentHTML("afterbegin",
      '<button type="button" class="banniere-pause" id="banniere-pause" aria-pressed="false" aria-label="Mettre le texte défilant en pause">❚❚</button>');
    var img = zone.querySelector(".banniere-img");
    function cadrer() {
      var acc = document.body.classList.contains("page-accueil");
      img.style.objectPosition = acc ? (ban.cadrage || "center") : (ban.cadrageCompact || ban.cadrage || "center");
    }
    cadrer();
    window.addEventListener("hashchange", cadrer);
    var bp = document.getElementById("banniere-pause");
    bp.addEventListener("click", function () {
      var p = zone.classList.toggle("en-pause");
      bp.setAttribute("aria-pressed", p ? "true" : "false");
      bp.textContent = p ? "▶" : "❚❚";
      bp.setAttribute("aria-label", p ? "Relancer le texte défilant" : "Mettre le texte défilant en pause");
    });
  }

  function initSite() {
    var s = DATA.site;
    document.getElementById("footer-text").textContent = "© " + new Date().getFullYear() + " " + (s.auteur || "") + (s.fonction ? " – " + s.fonction : "");
    if (s.licence) {
      document.getElementById("footer-licence").innerHTML = 'Contenus sous licence <a href="' + esc(s.licence.url) + '" target="_blank" rel="noopener">' + esc(s.licence.nom) + "</a>. " +
        (s.mentionFEI ? esc(s.mentionFEI) : "");
    }
  }

  initEspagnol();
  if ("speechSynthesis" in window) { window.speechSynthesis.getVoices(); }

  chargerTout().then(function () {
    initSite();
    window.addEventListener("hashchange", router);
    router();
    initBanniere();
  }).catch(function (err) {
    console.error(err);
    app.innerHTML = '<div class="encart attention"><h1>Impossible de charger le contenu</h1>' +
      "<p>Les fichiers du dossier <code>data</code> n'ont pas pu être lus (" + esc(err.message) + ").</p>" +
      "<p>Si vous ouvrez le fichier <code>index.html</code> directement depuis votre ordinateur, le navigateur bloque la lecture des fichiers JSON. " +
      "Publiez le site sur GitHub Pages ou lancez un petit serveur local (voir le README).</p></div>";
  });
})();

</script>
</body>
</html>
